version: "3.8"

# 搬瓦工部署用：镜像从阿里云 pull（不本地 build）。
# 前置：先在构建机跑 build-and-push.sh 与 build-and-push-leonardo.sh 推镜像。
# 使用：
#   docker compose -f docker-compose.deploy.yml --profile leonardo pull
#   docker compose -f docker-compose.deploy.yml --profile leonardo up -d
# 需在同目录准备：.env、config/config.json、leonardo_refresher/seccomp_profile.json（git clone 即有）

services:
  adobe2api:
    image: ${ADOBE2API_IMAGE:-registry.cn-shanghai.aliyuncs.com/hxh_ai/adobe2api:latest}
    container_name: adobe2api
    ports:
      - "6001:6001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      - PORT=6001
      - ADOBE_API_KEY=clio-playground-web
      - LEONARDO_REFRESH_KEY=${LEONARDO_REFRESH_KEY:-}
      - LEONARDO_PROXY=${LEONARDO_PROXY:-}
      - LEONARDO_TOKEN_MIN_TTL_SECONDS=${LEONARDO_TOKEN_MIN_TTL_SECONDS:-600}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped

  leonardo-refresher:
    profiles:
      - leonardo
    image: ${LEONARDO_REFRESHER_IMAGE:-registry.cn-shanghai.aliyuncs.com/hxh_ai/leonardo-refresher:latest}
    container_name: leonardo-refresher
    init: true
    depends_on:
      - adobe2api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # headless：无 noVNC；仅把 healthz 暴露到本机便于运维
      - "127.0.0.1:${LEONARDO_HEALTH_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Shanghai
      - ADOBE2API_BASE_URL=http://adobe2api:6001
      - LEONARDO_REFRESH_KEY=${LEONARDO_REFRESH_KEY:-}
      - LEONARDO_PROXY=${LEONARDO_PROXY:-}
      - LEONARDO_ACCOUNT_LABEL=${LEONARDO_ACCOUNT_LABEL:-Leonardo}
      - REFRESH_INTERVAL_SECONDS=${REFRESH_INTERVAL_SECONDS:-3000}
      - SAFETY_MARGIN_SECONDS=${LEONARDO_TOKEN_MIN_TTL_SECONDS:-600}
      - MIN_INTERVAL_SECONDS=${MIN_INTERVAL_SECONDS:-60}
      - PROFILE_DIR=/profile
      - HEALTH_HOST=0.0.0.0
      - HEALTH_PORT=8080
    volumes:
      - leo-profile:/profile
    shm_size: 1gb
    security_opt:
      - seccomp=leonardo_refresher/seccomp_profile.json
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  leo-profile:
