version: "3.8"

services:
  adobe2api:
    build: .
    container_name: adobe2api
    ports:
      - "6001:6001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      - PORT=6001
      - ADOBE_API_KEY=clio-playground-web
      - LEONARDO_REFRESH_KEY=${LEONARDO_REFRESH_KEY:-}
      - LEONARDO_PROXY=${LEONARDO_PROXY:-}
      - LEONARDO_TOKEN_MIN_TTL_SECONDS=${LEONARDO_TOKEN_MIN_TTL_SECONDS:-600}
    volumes:
      # 持久化生成数据
      - ./data:/app/data
      # 持久化配置数据
      - ./config:/app/config
    restart: unless-stopped

  leonardo-refresher:
    profiles:
      - leonardo
    build:
      context: .
      dockerfile: leonardo_refresher/Dockerfile
    container_name: leonardo-refresher
    init: true
    depends_on:
      - adobe2api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${LEONARDO_NOVNC_PORT:-6080}:6080"
    environment:
      - TZ=Asia/Shanghai
      - ADOBE2API_BASE_URL=http://adobe2api:6001
      - LEONARDO_REFRESH_KEY=${LEONARDO_REFRESH_KEY:-}
      - LEONARDO_PROXY=${LEONARDO_PROXY:-}
      - LEONARDO_ACCOUNT_LABEL=${LEONARDO_ACCOUNT_LABEL:-Leonardo}
      - REFRESH_INTERVAL_SECONDS=${REFRESH_INTERVAL_SECONDS:-3000}
      - SAFETY_MARGIN_SECONDS=${LEONARDO_TOKEN_MIN_TTL_SECONDS:-600}
      - MIN_INTERVAL_SECONDS=${MIN_INTERVAL_SECONDS:-60}
      - NOVNC_PASSWORD=${NOVNC_PASSWORD:-}
      - PROFILE_DIR=/profile
      - HEALTH_HOST=0.0.0.0
      - HEALTH_PORT=8080
    volumes:
      - leo-profile:/profile
    shm_size: 1gb
    security_opt:
      - seccomp=leonardo_refresher/seccomp_profile.json
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  leo-profile:
